[project]
name = "aivoice-http-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rin Iwai", email = "me@eyrin.jp" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "pythonnet>=3.2.1",
    "soundfile>=0.14.0",
    "soxr>=1.1.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]

[tool.fastapi]
entrypoint = "aivoice_http_server:app"
